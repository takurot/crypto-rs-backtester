name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  rust:
    name: Rust (core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo test (core, default features)
        run: cargo test -p backtester-core

      - name: cargo test (core, concurrent-sweeps feature)
        run: cargo test -p backtester-core --features concurrent-sweeps

      - name: cargo test (core, all optional features)
        run: cargo test -p backtester-core --features "concurrent-sweeps,numa,gpu-stats"

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo clippy (concurrent-sweeps feature)
        run: cargo clippy -p backtester-core --features concurrent-sweeps -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --deny warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19

      - name: cargo deny check
        run: cargo deny check

  python:
    name: Python E2E (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Python deps + build extension (maturin)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: mypy type check
        run: |
          . .venv/bin/activate
          mypy python/rust_backtester --ignore-missing-imports

      - name: pytest (E2E, excluding bench)
        run: |
          . .venv/bin/activate
          pytest -m "not bench" python/tests
