name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  rust:
    name: Rust (core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: cargo test (core)
        run: cargo test -p backtester-core

      - name: cargo clippy (core)
        run: cargo clippy -p backtester-core --all-targets -- -D warnings

  python:
    name: Python E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps + build extension (maturin)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: pytest (E2E, excluding bench)
        run: |
          . .venv/bin/activate
          pytest -m "not bench" python/tests

