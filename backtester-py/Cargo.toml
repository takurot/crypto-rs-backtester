[package]
name = "backtester-py"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
backtester-core = { path = "../backtester-core" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }
arrow = { version = "55", features = ["pyarrow"] }
rayon = "1.11.0"
