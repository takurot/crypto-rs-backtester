[advisories]
ignore = [
    # fast-float 0.2.0 — transitive dep locked by polars 0.40; no patched version
    # available in the polars 0.40 dep chain.
    { id = "RUSTSEC-2025-0003", reason = "transitive polars 0.40 dep; no fix available without polars upgrade" },
    { id = "RUSTSEC-2024-0379", reason = "transitive polars 0.40 dep; no fix available without polars upgrade" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Path dependencies have no version specifier; treat as warn not error.
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
