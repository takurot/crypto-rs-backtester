[advisories]
# RUSTSEC-2026-0176 / RUSTSEC-2026-0177: pyo3 0.24.2 advisories fixed in >=0.29.0.
# Upgrading is tracked separately in #118 due to PyO3 API changes between 0.24 and 0.29.
ignore = ["RUSTSEC-2026-0176", "RUSTSEC-2026-0177"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Path dependencies have no version specifier; treat as warn not error.
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
